version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # The NuGet updater ignores "include: scope" (it only reads the prefix),
    # so the scope is spelled out here to get "build(deps): ...".
    commit-message:
      prefix: "build(deps)"
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
    # The library csproj deliberately keeps these on the major version of its target, so that a .NET 10 app is
    # not pushed onto 11.x by this package. A new major version comes with a new target and is bumped by hand.
    ignore:
      - dependency-name: "Microsoft.Extensions.DependencyInjection"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "Microsoft.Extensions.Http"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "Microsoft.Extensions.Options.ConfigurationExtensions"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
