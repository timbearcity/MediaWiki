version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # The NuGet updater ignores "include: scope" (it only reads the prefix),
    # so the scope is spelled out here to get "build(deps): ...".
    commit-message:
      prefix: "build(deps)"
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
